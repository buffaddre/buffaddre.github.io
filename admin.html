<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADD FR - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#08090d;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    cursor:pointer;
    font-family:inherit;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#9276ff;
}

.btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    color:#fff;
    font-weight:bold;
    background:linear-gradient(135deg,#a087ff,#644cff);
}

.btn.red{
    background:#402027;
    color:#ff8e9c;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 20px 80px;
}

.title{
    font-size:35px;
    font-weight:900;
}

.sub{
    margin-top:7px;
    color:#777e8c;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:30px 0;
}

.stat{
    padding:20px;
    border:1px solid #292d38;
    border-radius:17px;
    background:#111319;
}

.stat b{
    display:block;
    font-size:25px;
    margin-bottom:8px;
}

.stat span{
    color:#777e8c;
    font-size:12px;
}

.order{
    margin-bottom:14px;
    padding:20px;
    border:1px solid #292d38;
    border-radius:18px;
    background:#111319;
}

.head{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.code{
    font-weight:900;
    font-size:17px;
}

.date{
    margin-top:5px;
    color:#666d7b;
    font-size:11px;
}

.status{
    height:max-content;
    padding:7px 11px;
    border-radius:30px;
    background:#29233f;
    color:#b9aaff;
    font-size:11px;
}

.info{
    margin-top:15px;
    color:#9aa1ae;
    font-size:13px;
    line-height:1.9;
    word-break:break-word;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:17px;
    flex-wrap:wrap;
}

.empty{
    padding:40px;
    text-align:center;
    border:1px dashed #292d38;
    border-radius:17px;
    color:#6d7481;
}

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    padding:13px 18px;
    border-radius:12px;
    background:#191c24;
    border:1px solid #303542;
    transform:translate(-50%,20px);
    opacity:0;
    transition:.25s;
    z-index:999;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    .head{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header class="nav">

    <div class="logo">
        <span>ADD</span> FR ADMIN
    </div>

    <button class="btn" onclick="logout()">
        Đăng xuất
    </button>

</header>


<main class="container">

    <div class="title">
        Quản lý đơn hàng
    </div>

    <div class="sub">
        Duyệt và cập nhật trạng thái đơn hàng.
    </div>


    <div class="stats">

        <div class="stat">
            <b id="totalOrders">0</b>
            <span>Tổng đơn</span>
        </div>

        <div class="stat">
            <b id="pendingOrders">0</b>
            <span>Đang xử lý</span>
        </div>

        <div class="stat">
            <b id="completedOrders">0</b>
            <span>Hoàn thành</span>
        </div>

    </div>


    <div id="orders">
        <div class="empty">
            Đang tải đơn hàng...
        </div>
    </div>

</main>


<div id="toast"></div>


<script>

const SUPABASE_URL =
"https://nslmutblflfotcxvctpp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kESQyw5xcjTe1irApsuRGQ_4X1GR0Xr";

const TELEGRAM_FUNCTION =
SUPABASE_URL +
"/functions/v1/notify-telegram";

const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


function money(n){
    return Number(n)
        .toLocaleString("vi-VN") + "đ";
}


function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function toast(text){

    const el =
        document.getElementById("toast");

    el.textContent = text;

    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {
            el.classList.remove("show");
        },3000);
}


async function sendTelegram(message){

    try{

        const response =
            await fetch(
                TELEGRAM_FUNCTION,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        message:message
                    })
                }
            );

        return await response.json();

    }catch(error){

        console.error(
            "Telegram:",
            error
        );

    }
}


async function checkAdmin(){

    const {
        data:{
            user
        }
    } = await sb.auth.getUser();

    if(!user){

        location.href =
            "login.html";

        return false;
    }


    const {
        data:profile,
        error
    } = await sb
        .from("profiles")
        .select("username,is_admin")
        .eq("id",user.id)
        .single();


    if(
        error ||
        !profile ||
        profile.is_admin !== true
    ){

        alert(
            "Bạn không có quyền admin."
        );

        location.href =
            "index.html";

        return false;
    }

    return true;
}


async function loadOrders(){

    const {
        data:orders,
        error
    } = await sb
        .from("orders")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        console.error(error);

        document
            .getElementById("orders")
            .innerHTML = `
                <div class="empty">
                    Không tải được đơn hàng.
                </div>
            `;

        return;
    }


    const total =
        orders?.length || 0;

    const pending =
        orders?.filter(
            o =>
                o.status === "processing"
        ).length || 0;

    const completed =
        orders?.filter(
            o =>
                o.status === "completed"
        ).length || 0;


    document
        .getElementById("totalOrders")
        .textContent = total;

    document
        .getElementById("pendingOrders")
        .textContent = pending;

    document
        .getElementById("completedOrders")
        .textContent = completed;


    const box =
        document.getElementById("orders");


    if(!orders || !orders.length){

        box.innerHTML = `
            <div class="empty">
                Chưa có đơn hàng.
            </div>
        `;

        return;
    }


    box.innerHTML =
        orders.map(order => {

            let status =
                "🟡 Đang xử lý";

            if(order.status === "approved")
                status = "🔵 Đã duyệt";

            if(order.status === "completed")
                status = "🟢 Hoàn thành";

            if(order.status === "cancelled")
                status = "🔴 Đã hủy";


            return `

            <div class="order">

                <div class="head">

                    <div>

                        <div class="code">
                            ${escapeHtml(
                                order.order_code
                            )}
                        </div>

                        <div class="date">
                            ${new Date(
                                order.created_at
                            ).toLocaleString("vi-VN")}
                        </div>

                    </div>

                    <div class="status">
                        ${status}
                    </div>

                </div>


                <div class="info">

                    📦 Số lượng:
                    <b>
                        ${escapeHtml(
                            order.quantity
                        )}
                    </b>
                    Add Fr

                    <br>

                    💰 Tổng tiền:
                    <b>
                        ${money(order.total)}
                    </b>

                    <br>

                    🔗 Facebook:
                    ${escapeHtml(
                        order.target
                    )}

                    <br>

                    👤 User ID:
                    ${escapeHtml(
                        order.user_id
                    )}

                </div>


                <div class="actions">

                    ${
                        order.status === "processing"
                        ?
                        `
                        <button
                            class="btn"
                            onclick="updateStatus(
                                '${order.id}',
                                'approved'
                            )"
                        >
                            ✓ Duyệt đơn
                        </button>
                        `
                        :
                        ""
                    }


                    ${
                        order.status !== "completed"
                        &&
                        order.status !== "cancelled"
                        ?
                        `
                        <button
                            class="btn"
                            onclick="updateStatus(
                                '${order.id}',
                                'completed'
                            )"
                        >
                            ✓ Hoàn thành
                        </button>

                        <button
                            class="btn red"
                            onclick="updateStatus(
                                '${order.id}',
                                'cancelled'
                            )"
                        >
                            ✕ Hủy
                        </button>
                        `
                        :
                        ""
                    }

                </div>

            </div>

            `;

        }).join("");
}


async function updateStatus(
    orderId,
    newStatus
){

    const confirmText =
        newStatus === "approved"
        ? "Duyệt đơn này?"
        : newStatus === "completed"
        ? "Đánh dấu đơn hoàn thành?"
        : "Hủy đơn này?";


    if(!confirm(confirmText))
        return;


    const {
        data,
        error
    } = await sb.rpc(
        "admin_update_order_status",
        {
            p_order_id:orderId,
            p_status:newStatus
        }
    );


    if(error){

        console.error(error);

        if(
            error.message
                .includes("NOT_ADMIN")
        ){

            toast(
                "Bạn không có quyền admin."
            );

        }else{

            toast(
                error.message ||
                "Không cập nhật được."
            );

        }

        return;
    }


    if(!data || !data.ok){

        toast(
            "Không cập nhật được đơn."
        );

        return;
    }


    let statusText =
        "Đã duyệt";

    if(newStatus === "completed")
        statusText = "Hoàn thành";

    if(newStatus === "cancelled")
        statusText = "Đã hủy";


    toast(
        "✅ " + statusText
    );


    await loadOrders();


    /*
       Lấy lại thông tin đơn
       để gửi Telegram
    */

    const {
        data:order
    } = await sb
        .from("orders")
        .select("*")
        .eq("id",orderId)
        .single();


    if(order){

        await sendTelegram(

`🔔 CẬP NHẬT ĐƠN ADD FR

🆔 Mã đơn: ${order.order_code}

📦 Số lượng: ${order.quantity} Add Fr

💰 Tổng tiền: ${money(order.total)}

🔗 Facebook:
${order.target}

📌 Trạng thái:
${statusText}`

        );

    }

}


async function logout(){

    await sb.auth.signOut();

    location.href =
        "login.html";
}


async function init(){

    const ok =
        await checkAdmin();

    if(!ok)
        return;

    await loadOrders();

}


init();

</script>

</body>
</html>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:Arial,sans-serif;
}

button{

}

.nav{
    max-width:1200px;
    margin:auto;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{

    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#9276ff;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.admin-badge{
    padding:9px 13px;
    border-radius:10px;
    border:1px solid #332d52;
    background:#15121f;
    color:#bbaaff;
    font-size:12px;
    font-weight:bold;
}

.btn{
    border:0;
    border-radius:10px;
    padding:11px 16px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(135deg,#a087ff,#644cff);
}

.btn.dark{
    background:#111319;
    border:1px solid #292d38;
}

.btn.green{
    background:#173d2b;
    border:1px solid #285c40;
    color:#7df0a9;
}

.btn.red{
    background:#3d191d;
    border:1px solid #63252c;
    color:#ff8992;
}

.btn.small{
    padding:8px 11px;
    font-size:12px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px 20px 80px;
}

.hero{
    padding:25px 0 35px;
}

.badge{
    color:#9276ff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:12px;
}

h1{
    font-size:42px;
}

.hero p{
    color:#777e8c;
    margin-top:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:45px;
}

.stat{
    padding:22px;
    border-radius:18px;
    border:1px solid #292d38;
    background:#111319;
}

.stat-title{
    color:#777e8c;
    font-size:12px;
}

.stat-value{
    font-size:28px;
    font-weight:900;
    margin-top:8px;
}

.section{
    margin-top:40px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.section-title h2{
    font-size:22px;
}

.table-wrap{
    overflow-x:auto;
    border:1px solid #292d38;
    border-radius:18px;
    background:#111319;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    text-align:left;
    color:#858c99;
    font-size:11px;
    text-transform:uppercase;
    padding:15px;
    border-bottom:1px solid #292d38;
}

td{
    padding:15px;
    border-bottom:1px solid #20232b;
    font-size:13px;
    vertical-align:middle;
}

tr:last-child td{
    border-bottom:0;
}

.user-id{
    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#777e8c;
    font-size:11px;
}

.order-code{
    font-weight:bold;
    color:#b7a9ff;
}

.amount{
    font-weight:bold;
    color:#8ef0ae;
}

.status{
    display:inline-block;
    padding:6px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
}

.status.pending{
    background:#322a17;
    color:#ffd76b;
}

.status.completed{
    background:#163622;
    color:#7df0a9;
}

.status.cancelled{
    background:#3b181d;
    color:#ff858f;
}

.status.approved{
    background:#163622;
    color:#7df0a9;
}

.status.rejected{
    background:#3b181d;
    color:#ff858f;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.empty{
    padding:35px;
    text-align:center;
    color:#686f7c;
}

.loading{
    padding:35px;
    text-align:center;
    color:#8d94a3;
}

#errorBox{
    display:none;
    margin-bottom:20px;
    padding:15px;
    border-radius:12px;
    background:#3b181d;
    border:1px solid #63252c;
    color:#ff9ba3;
    white-space:pre-wrap;
}

#toast{
    position:fixed;
    left:50%;
    bottom:20px;
    z-index:9999;
    padding:13px 18px;
    border-radius:12px;
    background:#191c24;
    border:1px solid #303542;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:700px){

    h1{
        font-size:32px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .nav{
        align-items:flex-start;
    }

    .nav-right{
        flex-direction:column;
        align-items:flex-end;
    }
}

<script>

const SUPABASE_URL =
"https://nslmutblflfotcxvctpp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kESQyw5xcjTe1irApsuRGQ_4X1GR0Xr";


const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==============================
// UTILS
// ==============================

function money(value){

    return Number(value || 0)
        .toLocaleString("vi-VN") + "đ";

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {

            el.classList.remove("show");

        },3000);

}


function showError(message){

    const box =
        document.getElementById("errorBox");

    box.textContent = message;

    box.style.display = "block";

}


function hideError(){

    document
        .getElementById("errorBox")
        .style.display = "none";

}


function formatDate(date){

    if(!date) return "-";

    return new Date(date)
        .toLocaleString("vi-VN");

}


// ==============================
// KIỂM TRA ADMIN
// ==============================

async function checkAdmin(){

    hideError();

    const {
        data,
        error
    } = await sb.auth.getUser();


    if(error){

        console.error(error);

        showError(
            "Không đọc được phiên đăng nhập:\n" +
            error.message
        );

        return false;
    }


    const user = data.user;


    if(!user){

        /*
         * Không dùng location.href ở đây ngay lập tức
         * để tránh trường hợp session chưa kịp khôi phục.
         */

        showError(
            "Không có phiên đăng nhập.\n\n" +
            "Hãy đăng nhập tài khoản trước rồi mở lại admin.html."
        );

        return false;
    }


    console.log("ADMIN USER:",user);


    const {
        data:profile,
        error:profileError
    } = await sb
        .from("profiles")
        .select("username,balance,is_admin")
        .eq("id",user.id)
        .maybeSingle();


    if(profileError){

        console.error(
            "PROFILE ERROR:",
            profileError
        );

        showError(
            "Không đọc được profiles:\n" +
            profileError.message
        );

        return false;
    }


    if(!profile){

        showError(
            "Không tìm thấy profile của tài khoản này.\n\n" +
            "User ID:\n" +
            user.id
        );

        return false;
    }


    console.log("ADMIN PROFILE:",profile);


    if(profile.is_admin !== true){

        showError(
            "Tài khoản này không có quyền ADMIN.\n\n" +
            "User ID:\n" +
            user.id
        );

        return false;
    }


    document
        .getElementById("adminName")
        .textContent =
            profile.username ||
            user.email ||
            "Admin";


    return true;
}


// ==============================
// LOAD DEPOSITS
// ==============================

async function loadDeposits(){

    const table =
        document.getElementById("depositTable");


    table.innerHTML = `
        <tr>
            <td colspan="6">
                <div class="loading">
                    Đang tải yêu cầu nạp...
                </div>
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await sb
        .from("deposit_requests")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        console.error(
            "DEPOSIT ERROR:",
            error
        );

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        Không tải được yêu cầu nạp.<br><br>
                        ${escapeHtml(error.message)}
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    if(!data || !data.length){

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        Chưa có yêu cầu nạp tiền.
                    </div>
                </td>
            </tr>
        `;

        document
            .getElementById("pendingDeposits")
            .textContent = "0";

        return;
    }


    const pending =
        data.filter(
            x => x.status === "pending"
        ).length;


    document
        .getElementById("pendingDeposits")
        .textContent = pending;


    table.innerHTML =
        data.map(item => {

            let statusClass =
                "pending";

            let statusText =
                "🟡 Chờ duyệt";


            if(item.status === "approved"){

                statusClass =
                    "approved";

                statusText =
                    "🟢 Đã duyệt";

            }


            if(
                item.status === "rejected" ||
                item.status === "cancelled"
            ){

                statusClass =
                    "rejected";

                statusText =
                    "🔴 Từ chối";

            }


            const canApprove =
                item.status === "pending";


            return `

                <tr>

                    <td>
                        <strong>
                            ${escapeHtml(item.id)}
                        </strong>
                    </td>


                    <td>

                        <div class="user-id">
                            ${escapeHtml(item.user_id)}
                        </div>

                    </td>


                    <td>

                        <span class="amount">
                            ${money(item.amount)}
                        </span>

                    </td>


                    <td>

                        <span class="status ${statusClass}">
                            ${statusText}
                        </span>

                    </td>


                    <td>
                        ${formatDate(item.created_at)}
                    </td>


                    <td>

                        ${
                            canApprove

                            ?

                            `
                            <div class="actions">

                                <button
                                    class="btn green small"
                                    onclick="approveDeposit('${escapeHtml(item.id)}','${escapeHtml(item.user_id)}',${Number(item.amount)})">
                                    ✓ Duyệt
                                </button>


                                <button
                                    class="btn red small"
                                    onclick="rejectDeposit('${escapeHtml(item.id)}')">
                                    ✕ Từ chối
                                </button>

                            </div>
                            `

                            :

                            `<span style="color:#666">
                                Đã xử lý
                            </span>`
                        }

                    </td>

                </tr>

            `;

        }).join("");

}


// ==============================
// DUYỆT NẠP TIỀN
// ==============================

async function approveDeposit(
    depositId,
    userId,
    amount
){

    if(!confirm(
        "Xác nhận duyệt khoản nạp " +
        money(amount) +
        "?"
    )){

        return;

    }


    try{

        /*
         * Đọc balance hiện tại
         */

        const {
            data:profile,
            error:profileError
        } = await sb
            .from("profiles")
            .select("balance")
            .eq("id",userId)
            .maybeSingle();


        if(profileError){

            throw profileError;

        }


        if(!profile){

            throw new Error(
                "Không tìm thấy profile của user: " +
                userId
            );

        }


        const oldBalance =
            Number(profile.balance || 0);


        const newBalance =
            oldBalance + Number(amount);


        /*
         * Cộng tiền
         */

        const {
            error:updateProfileError
        } = await sb
            .from("profiles")
            .update({
                balance:newBalance
            })
            .eq("id",userId);


        if(updateProfileError){

            throw updateProfileError;

        }


        /*
         * Đánh dấu yêu cầu đã duyệt
         */

        const {
            error:updateDepositError
        } = await sb
            .from("deposit_requests")
            .update({
                status:"approved",
                approve_at:new Date().toISOString()
            })
            .eq("id",depositId);


        if(updateDepositError){

            /*
             * Nếu lỗi ở bước này thì không nên im lặng.
             */

            throw updateDepositError;

        }


        toast(
            "✅ Đã duyệt và cộng " +
            money(amount)
        );


        await loadAll();

    }
    catch(error){

        console.error(
            "APPROVE DEPOSIT ERROR:",
            error
        );


        toast(
            "❌ Duyệt nạp thất bại"
        );


        showError(
            "Lỗi duyệt nạp:\n" +
            (
                error?.message ||
                String(error)
            )
        );

    }

}


// ==============================
// TỪ CHỐI NẠP
// ==============================

async function rejectDeposit(id){

    if(!confirm(
        "Xác nhận từ chối yêu cầu nạp này?"
    )){

        return;

    }


    const {
        error
    } = await sb
        .from("deposit_requests")
        .update({
            status:"rejected",
            approve_at:new Date().toISOString()
        })
        .eq("id",id);


    if(error){

        console.error(error);

        toast(
            "❌ Không thể từ chối"
        );

        showError(
            "Lỗi từ chối:\n" +
            error.message
        );

        return;
    }


    toast(
        "✅ Đã từ chối yêu cầu"
    );


    await loadDeposits();

}

// LOAD ORDERS
// ==============================

async function loadOrders(){

    const table =
        document.getElementById("orderTable");


    table.innerHTML = `
        <tr>
            <td colspan="7">
                <div class="loading">
                    Đang tải đơn hàng...
                </div>
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await sb
        .from("orders")
        .select("*")
        .order("created_at",{
            ascending:false
        });


    if(error){

        console.error(
            "ORDERS ERROR:",
            error
        );


        table.innerHTML = `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        Không tải được đơn hàng.<br><br>
                        ${escapeHtml(error.message)}
                    </div>
                </td>
            </tr>
        `;

        return;
    }


    if(!data || !data.length){

        table.innerHTML = `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        Chưa có đơn hàng.
                    </div>
                </td>
            </tr>
        `;


        document
            .getElementById("pendingOrders")
            .textContent = "0";


        document
            .getElementById("totalOrders")
            .textContent = "0";


        return;
    }


    const pending =
        data.filter(
            x => x.status === "pending"
        ).length;


    document
        .getElementById("pendingOrders")
        .textContent = pending;


    document
        .getElementById("totalOrders")
        .textContent = data.length;


    table.innerHTML =
        data.map(item => {

            let statusClass =
                "pending";

            let statusText =
                "🟡 Đang xử lý";


            if(item.status === "completed"){

                statusClass =
                    "completed";

                statusText =
                    "🟢 Hoàn thành";

            }


            if(item.status === "cancelled"){

                statusClass =
                    "cancelled";

                statusText =
                    "🔴 Đã hủy";

            }


            const canProcess =
                item.status === "pending";


            return `

                <tr>

                    <td>

                        <div class="order-code">
                            ${escapeHtml(item.order_code)}
                        </div>

                        <div style="
                            color:#666;
                            font-size:10px;
                            margin-top:5px;
                        ">
                            ${formatDate(item.created_at)}
                        </div>

                    </td>


                    <td>

                        <div class="user-id">
                            ${escapeHtml(item.user_id)}
                        </div>

                    </td>


                    <td>
                        ${Number(item.quantity).toLocaleString("vi-VN")}
                    </td>


                    <td>

                        <span class="amount">
                            ${money(item.total)}
                        </span>

                    </td>


                    <td>

                        <a
                            href="${escapeHtml(item.target)}"
                            target="_blank"
                            style="
                                color:#a894ff;
                                max-width:180px;
                                display:block;
                                overflow:hidden;
                                text-overflow:ellipsis;
                                white-space:nowrap;
                            "
                        >
                            ${escapeHtml(item.target)}
                        </a>

                    </td>


                    <td>

                        <span class="status ${statusClass}">
                            ${statusText}
                        </span>

                    </td>


                    <td>

                        ${
                            canProcess

                            ?

                            `
                            <div class="actions">

                                <button
                                    class="btn green small"
                                    onclick="completeOrder('${escapeHtml(item.id)}')">
                                    ✓ Duyệt
                                </button>


                                <button
                                    class="btn red small"
                                    onclick="cancelOrder('${escapeHtml(item.id)}')">
                                    ✕ Hủy
                                </button>

                            </div>
                            `

                            :

                            `<span style="color:#666">
                                Đã xử lý
                            </span>`
                        }

                    </td>

                </tr>

            `;

        }).join("");

}


// ==============================
// DUYỆT ĐƠN
// ==============================

async function completeOrder(id){

    if(!confirm(
        "Xác nhận hoàn thành đơn hàng?"
    )){

        return;

    }


    const {
        error
    } = await sb
        .from("orders")
        .update({
            status:"completed"
        })
        .eq("id",id);


    if(error){

        console.error(
            "COMPLETE ORDER ERROR:",
            error
        );


        toast(
            "❌ Không thể duyệt đơn"
        );


        showError(
            "Lỗi duyệt đơn:\n" +
            error.message
        );

        return;
    }


    toast(
        "✅ Đã duyệt đơn"
    );


    await loadOrders();

}


// ==============================
// HỦY ĐƠN
// ==============================

async function cancelOrder(id){

    if(!confirm(
        "Xác nhận hủy đơn hàng?"
    )){

        return;

    }


    const {
        error
    } = await sb
        .from("orders")
        .update({
            status:"cancelled"
        })
        .eq("id",id);


    if(error){

        console.error(
            "CANCEL ORDER ERROR:",
            error
        );


        toast(
            "❌ Không thể hủy đơn"
        );


        showError(
            "Lỗi hủy đơn:\n" +
            error.message
        );

        return;
    }


    toast(
        "✅ Đã hủy đơn"
    );


    await loadOrders();

}


// ==============================
// LOAD ALL
// ==============================

async function loadAll(){

    hideError();

    await Promise.all([
        loadDeposits(),
        loadOrders()
    ]);

}


// ==============================
// LOGOUT
// ==============================

async function logout(){

    await sb.auth.signOut();

    location.href =
        "login.html";

}


// ==============================
// INIT
// ==============================

async function init(){

    /*
     * Đợi Supabase khôi phục session
     */

    const {
        data
    } = await sb.auth.getSession();


    console.log(
        "SESSION:",
        data.session
    );


    const isAdmin =
        await checkAdmin();


    if(!isAdmin){

        return;

    }


    await loadAll();

}


init();

</script>

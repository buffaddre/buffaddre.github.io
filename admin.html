<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>ADD FR - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#08090d;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:22px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#9276ff;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px 80px;
}

.title{
    font-size:36px;
    font-weight:900;
}

.subtitle{
    margin-top:7px;
    color:#777e8c;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:30px 0;
}

.stat{
    padding:20px;
    border:1px solid #292d38;
    border-radius:18px;
    background:#111319;
}

.stat-number{
    font-size:27px;
    font-weight:900;
}

.stat-label{
    margin-top:6px;
    color:#777e8c;
    font-size:12px;
}

.section{
    margin-top:45px;
}

.section-title{
    font-size:25px;
    font-weight:900;
    margin-bottom:18px;
}

.card{
    margin-bottom:12px;
    padding:20px;
    border:1px solid #292d38;
    border-radius:18px;
    background:#111319;
}

.card-head{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.code{
    font-weight:900;
    font-size:16px;
}

.date{
    margin-top:5px;
    color:#656c79;
    font-size:11px;
}

.status{
    height:max-content;
    padding:7px 11px;
    border-radius:30px;
    font-size:11px;
    background:#29233f;
    color:#b9aaff;
}

.status.approved{
    background:#183625;
    color:#62e79a;
}

.status.rejected{
    background:#3b2025;
    color:#ff8997;
}

.info{
    margin-top:14px;
    color:#9299a7;
    font-size:13px;
    line-height:1.9;
    word-break:break-word;
}

.info b{
    color:#fff;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:17px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    color:#fff;
    font-weight:bold;
    background:linear-gradient(
        135deg,
        #a087ff,
        #644cff
    );
}

.btn.green{
    background:#173d2a;
    color:#66e49a;
}

.btn.red{
    background:#402027;
    color:#ff8997;
}

.btn.dark{
    background:#111319;
    border:1px solid #292d38;
}

.empty{
    padding:35px;
    text-align:center;
    border:1px dashed #292d38;
    border-radius:17px;
    color:#6d7481;
}

.refresh{
    margin-left:8px;
}

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:9999;

    padding:13px 18px;

    border-radius:12px;
    border:1px solid #303542;

    background:#191c24;

    transform:translate(-50%,20px);
    opacity:0;

    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr;
    }

    .card-head{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<header class="nav">

    <div class="logo">
        <span>ADD</span> FR ADMIN
    </div>

    <div>

        <button
            class="btn dark"
            onclick="loadAll()">
            🔄 Làm mới
        </button>

        <button
            class="btn dark"
            onclick="logout()">
            Đăng xuất
        </button>

    </div>

</header>



<main class="container">


    <div class="title">
        Quản lý hệ thống
    </div>

    <div class="subtitle">
        Quản lý nạp tiền và đơn hàng.
    </div>



    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="depositCount">
                0
            </div>

            <div class="stat-label">
                Nạp tiền chờ duyệt
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="orderCount">
                0
            </div>

            <div class="stat-label">
                Đơn đang xử lý
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="approvedDeposit">
                0đ
            </div>

            <div class="stat-label">
                Tiền đã duyệt
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="completedOrders">
                0
            </div>

            <div class="stat-label">
                Đơn hoàn thành
            </div>

        </div>

    </div>



    <!-- ========================= -->
    <!-- DEPOSIT -->
    <!-- ========================= -->

    <section class="section">

        <div class="section-title">
            💰 Yêu cầu nạp tiền
        </div>

        <div id="deposits">

            <div class="empty">
                Đang tải yêu cầu nạp...
            </div>

        </div>

    </section>



    <!-- ========================= -->
    <!-- ORDERS -->
    <!-- ========================= -->

    <section class="section">

        <div class="section-title">
            📦 Đơn hàng
        </div>

        <div id="orders">

            <div class="empty">
                Đang tải đơn hàng...
            </div>

        </div>

    </section>


</main>



<div id="toast"></div>



<script>


/* ================================
   SUPABASE
================================ */


const SUPABASE_URL =
"https://nslmutblflfotcxvctpp.supabase.co";


const SUPABASE_KEY =
"sb_publishable_kESQyw5xcjTe1irApsuRGQ_4X1GR0Xr";


const TELEGRAM_FUNCTION =
SUPABASE_URL +
"/functions/v1/notify-telegram";


const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* ================================
   UTIL
================================ */


function money(n){

    return Number(n || 0)
        .toLocaleString("vi-VN")
        + "đ";

}



function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



function toast(text){

    const el =
        document.getElementById("toast");

    el.textContent = text;

    el.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {
                el.classList.remove("show");
            },
            3000
        );

}



/* ================================
   TELEGRAM
================================ */


async function sendTelegram(message){

    try{

        const response =
            await fetch(
                TELEGRAM_FUNCTION,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:message
                    })
                }
            );

        return await response.json();

    }catch(error){

        console.error(
            "Telegram error:",
            error
        );

    }

}



/* ================================
   ADMIN CHECK
================================ */


async function checkAdmin(){

    const {
        data:{
            user
        }
    } = await sb.auth.getUser();


    if(!user){

        location.href =
            "login.html";

        return false;

    }


    const {
        data:profile,
        error
    } = await sb
        .from("profiles")
        .select("username,is_admin")
        .eq("id",user.id)
        .single();


    if(
        error ||
        !profile ||
        profile.is_admin !== true
    ){

        alert(
            "Tài khoản này không phải admin."
        );

        location.href =
            "index.html";

        return false;

    }


    return true;

}



/* ================================
   LOAD DEPOSITS
================================ */


async function loadDeposits(){

    const {
        data,
        error
    } = await sb
        .from("deposit_requests")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    const box =
        document.getElementById(
            "deposits"
        );


    if(error){

        console.error(
            "Deposit error:",
            error
        );

        box.innerHTML = `
            <div class="empty">
                Không tải được yêu cầu nạp.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

        return;

    }


    const pending =
        data.filter(
            x => x.status === "pending"
        );


    document
        .getElementById(
            "depositCount"
        )
        .textContent =
            pending.length;


    const approvedMoney =
        data
            .filter(
                x =>
                    x.status === "approved"
            )
            .reduce(
                (
                    total,
                    x
                ) =>
                    total +
                    Number(x.amount || 0),
                0
            );


    document
        .getElementById(
            "approvedDeposit"
        )
        .textContent =
            money(approvedMoney);


    if(!data.length){

        box.innerHTML = `
            <div class="empty">
                Chưa có yêu cầu nạp tiền.
            </div>
        `;

        return;

    }


    box.innerHTML =
        data.map(
            deposit => {

                let statusText =
                    "🟡 Chờ duyệt";

                let statusClass = "";


                if(
                    deposit.status ===
                    "approved"
                ){

                    statusText =
                        "🟢 Đã duyệt";

                    statusClass =
                        "approved";

                }


                if(
                    deposit.status ===
                    "rejected"
                ){

                    statusText =
                        "🔴 Từ chối";

                    statusClass =
                        "rejected";

                }


                return `

                <div class="card">

                    <div class="card-head">

                        <div>

                            <div class="code">

                                NẠP #${escapeHtml(
                                    deposit.id
                                )}

                            </div>

                            <div class="date">

                                ${new Date(
                                    deposit.created_at
                                ).toLocaleString(
                                    "vi-VN"
                                )}

                            </div>

                        </div>


                        <div
                            class="status ${statusClass}">

                            ${statusText}

                        </div>

                    </div>


                    <div class="info">

                        👤 User ID:
                        <b>
                            ${escapeHtml(
                                deposit.user
                            )}
                        </b>

                        <br>

                        💰 Số tiền:
                        <b>
                            ${money(
                                deposit.amount
                            )}
                        </b>

                        <br>

                        🕐 Tạo lúc:
                        ${new Date(
                            deposit.created_at
                        ).toLocaleString(
                            "vi-VN"
                        )}

                        <br>

                        ${
                            deposit.approve_at
                            ?
                            `
                            ✅ Xử lý lúc:
                            ${new Date(
                                deposit.approve_at
                            ).toLocaleString(
                                "vi-VN"
                            )}
                            `
                            :
                            `
                            ⏳ Chưa xử lý
                            `
                        }

                    </div>


                    ${
                        deposit.status ===
                        "pending"
                        ?
                        `

                        <div class="actions">

                            <button
                                class="btn green"
                                onclick="
                                    approveDeposit(
                                        '${deposit.id}'
                                    )
                                ">

                                ✓ Duyệt tiền

                            </button>


                            <button
                                class="btn red"
                                onclick="
                                    rejectDeposit(
                                        '${deposit.id}'
                                    )
                                ">

                                ✕ Từ chối

                            </button>

                        </div>

                        `
                        :
                        ""
                    }

                </div>

                `;

            }
        ).join("");

}



/* ================================
   APPROVE DEPOSIT
================================ */


async function approveDeposit(
    depositId
){

    if(
        !confirm(
            "Xác nhận DUYỆT tiền cho khách?"
        )
    ){

        return;

    }


    const {
        data,
        error
    } = await sb.rpc(
        "admin_approve_deposit",
        {
            p_deposit_id:
                depositId
        }
    );


    if(error){

        console.error(
            "Approve deposit:",
            error
        );

        toast(
            "❌ " +
            error.message
        );

        return;

    }


    if(!data || !data.ok){

        toast(
            "❌ Không duyệt được."
        );

        return;

    }


    toast(
        "✅ Đã cộng tiền cho khách."
    );


    /*
       Gửi Telegram
    */

    await sendTelegram(

`💰 NẠP TIỀN ĐÃ DUYỆT

👤 User ID:
${data.user_id}

💵 Số tiền:
${money(data.amount)}

🟢 Trạng thái:
Đã cộng vào số dư khách.`

    );


    await loadDeposits();

}



/* ================================
   REJECT DEPOSIT
================================ */


async function rejectDeposit(
    depositId
){

    if(
        !confirm(
            "Xác nhận TỪ CHỐI yêu cầu nạp?"
        )
    ){

        return;

    }


    const {
        data,
        error
    } = await sb.rpc(
        "admin_reject_deposit",
        {
            p_deposit_id:
                depositId
        }
    );


    if(error){

        console.error(
            "Reject deposit:",
            error
        );

        toast(
            "❌ " +
            error.message
        );

        return;

    }


    toast(
        "🚫 Đã từ chối yêu cầu nạp."
    );


    await sendTelegram(

`🚫 YÊU CẦU NẠP TIỀN BỊ TỪ CHỐI

🆔 Deposit:
${depositId}

🔴 Trạng thái:
Từ chối`

    );


    await loadDeposits();

}



/* ================================
   LOAD ORDERS
================================ */


async function loadOrders(){

    const {
        data,
        error
    } = await sb
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    const box =
        document.getElementById(
            "orders"
        );


    if(error){

        console.error(
            "Orders error:",
            error
        );

        box.innerHTML = `
            <div class="empty">
                Không tải được đơn hàng.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

        return;

    }


    const processing =
        data.filter(
            x =>
                x.status ===
                "processing"
        );


    document
        .getElementById(
            "orderCount"
        )
        .textContent =
            processing.length;


    document
        .getElementById(
            "completedOrders"
        )
        .textContent =
            data.filter(
                x =>
                    x.status ===
                    "completed"
            ).length;


    if(!data.length){

        box.innerHTML = `
            <div class="empty">
                Chưa có đơn hàng.
            </div>
        `;

        return;

    }


    box.innerHTML =
        data.map(
            order => {

                let statusText =
                    "🟡 Đang xử lý";

                let statusClass = "";


                if(
                    order.status ===
                    "approved"
                ){

                    statusText =
                        "🔵 Đã duyệt";

                    statusClass =
                        "approved";

                }


                if(
                    order.status ===
                    "completed"
                ){

                    statusText =
                        "🟢 Hoàn thành";

                    statusClass =
                        "approved";

                }


                if(
                    order.status ===
                    "cancelled"
                ){

                    statusText =
                        "🔴 Đã hủy";

                    statusClass =
                        "rejected";

                }


                return `

                <div class="card">

                    <div class="card-head">

                        <div>

                            <div class="code">

                                ${escapeHtml(
                                    order.order_code
                                )}

                            </div>

                            <div class="date">

                                ${new Date(
                                    order.created_at
                                ).toLocaleString(
                                    "vi-VN"
                                )}

                            </div>

                        </div>


                        <div
                            class="status ${statusClass}">

                            ${statusText}

                        </div>

                    </div>


                    <div class="info">

                        👤 User ID:
                        <b>
                            ${escapeHtml(
                                order.user_id
                            )}
                        </b>

                        <br>

                        📦 Số lượng:
                        <b>
                            ${escapeHtml(
                                order.quantity
                            )}
                        </b>
                        Add Fr

                        <br>

                        💰 Tổng tiền:
                        <b>
                            ${money(
                                order.total
                            )}
                        </b>

                        <br>

                        🔗 Facebook:
                        ${escapeHtml(
                            order.target
                        )}

                    </div>


                    ${
                        order.status ===
                        "processing"
                        ?
                        `

                        <div class="actions">

                            <button
                                class="btn green"
                                onclick="
                                    updateOrder(
                                        '${order.id}',
                                        'approved'
                                    )
                                ">

                                ✓ Duyệt đơn

                            </button>


                            <button
                                class="btn red"
                                onclick="
                                    updateOrder(
                                        '${order.id}',
                                        'cancelled'
                                    )
                                ">

                                ✕ Hủy

                            </button>

                        </div>

                        `
                        :
                        ""
                    }


                    ${
                        order.status ===
                        "approved"
                        ?
                        `

                        <div class="actions">

                            <button
                                class="btn green"
                                onclick="
                                    updateOrder(
                                        '${order.id}',
                                        'completed'
                                    )
                                ">

                                ✓ Hoàn thành

                            </button>


                            <button
                                class="btn red"
                                onclick="
                                    updateOrder(
                                        '${order.id}',
                                        'cancelled'
                                    )
                                ">

                                ✕ Hủy

                            </button>

                        </div>

                        `
                        :
                        ""
                    }

                </div>

                `;

            }
        ).join("");

}



/* ================================
   UPDATE ORDER
================================ */


async function updateOrder(
    orderId,
    newStatus
){

    let question =
        "Xác nhận cập nhật đơn?";


    if(
        newStatus ===
        "approved"
    ){

        question =
            "Xác nhận DUYỆT đơn?";

    }


    if(
        newStatus ===
        "completed"
    ){

        question =
            "Xác nhận HOÀN THÀNH đơn?";

    }


    if(
        newStatus ===
        "cancelled"
    ){

        question =
            "Xác nhận HỦY đơn?";

    }


    if(!confirm(question))
        return;


    const {
        data,
        error
    } = await sb.rpc(
        "admin_update_order_status",
        {
            p_order_id:
                orderId,

            p_status:
                newStatus
        }
    );


    if(error){

        console.error(
            "Update order:",
            error
        );

        toast(
            "❌ " +
            error.message
        );

        return;

    }


    if(!data || !data.ok){

        toast(
            "❌ Không cập nhật được."
        );

        return;

    }


    let statusText =
        "Đã cập nhật";


    if(
        newStatus ===
        "approved"
    ){

        statusText =
            "Đã duyệt";

    }


    if(
        newStatus ===
        "completed"
    ){

        statusText =
            "Đã hoàn thành";

    }


    if(
        newStatus ===
        "cancelled"
    ){

        statusText =
            "Đã hủy";

    }


    toast(
        "✅ " + statusText
    );


    /*
       Lấy đơn để báo Telegram
    */

    const {
        data:order
    } = await sb
        .from("orders")
        .select("*")
        .eq(
            "id",
            orderId
        )
        .single();


    if(order){

        await sendTelegram(

`📦 CẬP NHẬT ĐƠN ADD FR

🆔 Mã đơn:
${order.order_code}

👤 User ID:
${order.user_id}

📦 Số lượng:
${order.quantity} Add Fr

💰 Tổng tiền:
${money(order.total)}

🔗 Facebook:
${order.target}

📌 Trạng thái:
${statusText}`

        );

    }


    await loadOrders();

}



/* ================================
   LOAD ALL
================================ */


async function loadAll(){

    await loadDeposits();

    await loadOrders();

}



/* ================================
   LOGOUT
================================ */


async function logout(){

    await sb.auth.signOut();

    location.href =
        "login.html";

}



/* ================================
   INIT
================================ */


async function init(){

    const ok =
        await checkAdmin();

    if(!ok)
        return;

    await loadAll();

}


init();

</script>

</body>
</html>

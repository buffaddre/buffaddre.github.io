<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng ký - ADD FR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#08090d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.box{
    width:min(420px,100%);
    padding:30px;
    border:1px solid #292d38;
    border-radius:24px;
    background:#111319;
    box-shadow:0 20px 60px #0008;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:8px;
}

.logo span{
    color:#9276ff;
}

.sub{
    color:#7f8796;
    font-size:13px;
    margin-bottom:25px;
}

label{
    display:block;
    margin:16px 0 7px;
    color:#9aa1af;
    font-size:12px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #292d38;
    border-radius:12px;
    outline:none;
    background:#090a0e;
    color:#fff;
}

input:focus{
    border-color:#9178ff;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#a087ff,#644cff);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

.link{
    display:block;
    margin-top:18px;
    text-align:center;
    color:#9b87ff;
    text-decoration:none;
    font-size:13px;
}

#error{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#351b20;
    color:#ff8997;
    font-size:12px;
}

#success{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#173324;
    color:#68e59c;
    font-size:12px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        <span>ADD</span> FR
    </div>

    <div class="sub">
        Tạo tài khoản mới
    </div>


    <label>Username</label>

    <input
        id="username"
        type="text"
        placeholder="username"
        maxlength="30"
        autocomplete="username"
    >


    <label>Email</label>

    <input
        id="email"
        type="email"
        placeholder="you@example.com"
        autocomplete="email"
    >


    <label>Mật khẩu</label>

    <input
        id="password"
        type="password"
        placeholder="Tối thiểu 6 ký tự"
        autocomplete="new-password"
    >


    <label>Nhập lại mật khẩu</label>

    <input
        id="confirm"
        type="password"
        placeholder="Nhập lại mật khẩu"
        autocomplete="new-password"
    >


    <button
        id="registerBtn"
        onclick="register()"
    >
        Tạo tài khoản
    </button>


    <div id="error"></div>

    <div id="success"></div>


    <a class="link" href="login.html">
        Đã có tài khoản? Đăng nhập
    </a>

    <a class="link" href="index.html">
        ← Quay lại trang dịch vụ
    </a>

</div>


<script>

const SUPABASE_URL =
    "https://nslmutblflfotcxvctpp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_kESQyw5xcjTe1irApsuRGQ_4X1GR0Xr";


const sb =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function showError(message){

    const el =
        document.getElementById(
            "error"
        );

    el.textContent = message;

    el.style.display = "block";

    document.getElementById(
        "success"
    ).style.display = "none";
}


function showSuccess(message){

    const el =
        document.getElementById(
            "success"
        );

    el.textContent = message;

    el.style.display = "block";

    document.getElementById(
        "error"
    ).style.display = "none";
}


async function register(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const confirm =
        document.getElementById(
            "confirm"
        ).value;


    // =========================
    // VALIDATION
    // =========================

    if(
        !username ||
        !email ||
        !password ||
        !confirm
    ){

        showError(
            "Vui lòng nhập đầy đủ thông tin."
        );

        return;
    }


    if(username.length < 3){

        showError(
            "Username phải có ít nhất 3 ký tự."
        );

        return;
    }


    if(password.length < 6){

        showError(
            "Mật khẩu phải có ít nhất 6 ký tự."
        );

        return;
    }


    if(password !== confirm){

        showError(
            "Mật khẩu nhập lại không khớp."
        );

        return;
    }


    const button =
        document.getElementById(
            "registerBtn"
        );

    button.disabled = true;

    button.textContent =
        "Đang tạo tài khoản...";


    try{

        // =========================
        // CREATE AUTH USER
        // =========================

        const {
            data,
            error
        } = await sb.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{

                    username:username

                }

            }

        });


        if(error){

            throw error;

        }


        // =========================
        // PROFILE
        // =========================

        /*
          Nếu database của bạn có trigger
          tự tạo profile thì không cần insert.

          Nếu chưa có trigger, đoạn này
          sẽ tạo profile thủ công.
        */

        if(data.user){

            const {
                error:profileError
            } = await sb
                .from("profiles")
                .upsert({

                    id:data.user.id,

                    username:username,

                    balance:0

                });


            if(profileError){

                console.warn(
                    "Profile:",
                    profileError
                );

            }

        }


        // =========================
        // SUCCESS
        // =========================

        showSuccess(
            "Tạo tài khoản thành công!"
        );


        setTimeout(function(){

            window.location.href =
                "login.html";

        },1000);


    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "Không thể tạo tài khoản."
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "Tạo tài khoản";

    }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hệ thống đang bảo trì</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(120, 120, 255, .12), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(0, 200, 255, .08), transparent 35%),
        #07080d;
    color: #fff;
    overflow: hidden;
}

/* Ánh sáng nền */
body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: rgba(120, 90, 255, .12);
    filter: blur(120px);
    border-radius: 50%;
    top: -200px;
    left: -150px;
}

body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    background: rgba(0, 180, 255, .08);
    filter: blur(120px);
    border-radius: 50%;
    bottom: -200px;
    right: -100px;
}

/* Card */
.container {
    position: relative;
    z-index: 2;
    width: min(92%, 520px);
    padding: 45px 35px;
    text-align: center;

    background: rgba(20, 21, 29, .72);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 28px;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 25px 80px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.05);

    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Icon */
.icon {
    width: 120px;
    height: 120px;
    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 65px;

    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 50%;

    box-shadow:
        0 0 40px rgba(255,255,255,.04);

    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

/* Badge */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 8px 14px;
    margin-bottom: 18px;

    border-radius: 50px;

    background: rgba(255, 184, 77, .08);
    border: 1px solid rgba(255, 184, 77, .18);

    color: #ffc56b;
    font-size: 13px;
    font-weight: 600;
}

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffc56b;
    box-shadow: 0 0 10px #ffc56b;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

h1 {
    font-size: clamp(28px, 6vw, 40px);
    margin-bottom: 15px;
    letter-spacing: -.8px;
}

.description {
    color: #9b9daa;
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 28px;
}

/* Thông tin */
.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 25px;
}

.info-box {
    padding: 14px;
    border-radius: 15px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.06);
}

.info-box span {
    display: block;
    color: #777a87;
    font-size: 12px;
    margin-bottom: 5px;
}

.info-box strong {
    font-size: 14px;
}

/* Button */
button {
    width: 100%;
    padding: 14px 20px;

    border: 0;
    border-radius: 14px;

    background: #fff;
    color: #08090d;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
    transition: .25s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,255,255,.12);
}

.footer {
    margin-top: 22px;
    color: #555864;
    font-size: 12px;
}

/* Mobile */
@media (max-width: 500px) {
    .container {
        padding: 35px 22px;
        border-radius: 23px;
    }

    .icon {
        width: 100px;
        height: 100px;
        font-size: 55px;
    }

    .info {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Icon buồn -->
    <div class="icon">
        😢
    </div>

    <div class="badge">
        <span class="dot"></span>
        HỆ THỐNG ĐANG BẢO TRÌ
    </div>

    <h1>Xin lỗi bạn nhé!</h1>

    <p class="description">
        Hệ thống hiện đang được bảo trì và nâng cấp
        để mang đến trải nghiệm ổn định và tốt hơn.
        Vui lòng quay lại sau ít phút.
    </p>

    <div class="info">

        <div class="info-box">
            <span>Trạng thái</span>
            <strong>🔧 Đang bảo trì</strong>
        </div>

        <div class="info-box">
            <span>Dự kiến hoạt động</span>
            <strong>⏰ Sớm trở lại</strong>
        </div>

    </div>

    <button onclick="location.reload()">
        ↻ Thử tải lại trang
    </button>

    <div class="footer">
        liên Hệ : zalo.me/wanhtu - t.me/wanhtu ❤️
    </div>

</div>

</body>
</html>
